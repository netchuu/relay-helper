name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux
      - run: bun install --frozen-lockfile
      - run: cd cloud && bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck
      - run: bun run lint
      - run: cd cloud && bun run typecheck
